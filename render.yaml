services:
  - type: web
    name: exam-saathi-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /
    envVars:
      - key: EXAM_SAATHI_EMBEDDINGS
        value: disabled
      - key: REQUIRE_AUTH
        value: "true"
      - key: EXAM_SAATHI_USERNAME
        sync: false
      - key: EXAM_SAATHI_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "75000"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "12000"
